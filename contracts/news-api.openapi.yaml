openapi: 3.1.0
info:
  title: Praxis News API
  version: 1.0.0
  description: Public read-only contract exposed by the Praxis API Gateway.
paths:
  /api/news:
    get:
      operationId: listNews
      summary: List active and currently valid news
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A stable page sorted by publishedAt and id descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPage"
        "422":
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The News Service returned an invalid response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The News Service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    NewsItem:
      type: object
      additionalProperties: false
      required: [id, title, summary, content, publishedAt, validFrom, validUntil]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        content:
          type: string
          description: Untrusted plain text; never HTML.
        publishedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validUntil:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    NewsPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

