<div class="app-shell" [class.nav-open]="navOpen()">
  <header class="topbar">
    <button
      type="button"
      class="nav-toggle"
      (click)="toggleNav()"
      [attr.aria-expanded]="navOpen()"
      aria-controls="primary-nav"
      aria-label="Navigation umschalten"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <span class="brand">Praxis</span>
  </header>

  <nav id="primary-nav" class="sidebar" aria-label="Hauptnavigation">
    <ul>
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-link"
            (click)="closeNav()"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                [attr.d]="item.icon"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <button
    type="button"
    class="scrim"
    aria-label="Navigation schließen"
    (click)="closeNav()"
  ></button>

  <main class="content">
    <router-outlet />
  </main>
</div>
