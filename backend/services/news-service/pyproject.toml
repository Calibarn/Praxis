[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-news-service"
version = "0.1.0"
description = "News source-of-truth microservice for the Praxis application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "asyncmy==0.2.14",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["news_service"]
